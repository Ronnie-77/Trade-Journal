<svg xmlns="http://www.w3.org/2000/svg" viewBox="428 312 463 509" width="32" height="32">
  <style>
    /* Theme-aware: white logo in dark browser tabs, dark logo in light tabs.
       No background — transparent, sits directly on the tab surface. */
    .logo { fill: #FFFFFF; }
    @media (prefers-color-scheme: light) {
      .logo { fill: #15171C; }
    }
  </style>

  <!-- Logo: 3 candlesticks + zigzag growth arrow + solid arrowhead.
       viewBox cropped tightly around the content so the logo fills
       the full favicon area. No background, no border. -->
  <g class="logo">
    <!-- Candle 1 — left -->
    <rect x="525" y="484" width="9" height="50"/>
    <rect x="499" y="531" width="61" height="211"/>
    <rect x="525" y="738" width="9" height="53"/>
    <!-- Candle 2 — middle, tallest -->
    <rect x="634" y="377" width="9" height="58"/>
    <rect x="608" y="431" width="60" height="187"/>
    <rect x="634" y="614" width="9" height="22"/>
    <!-- Candle 3 — right -->
    <rect x="742" y="443" width="9" height="50"/>
    <rect x="716" y="490" width="62" height="175"/>
    <rect x="742" y="661" width="9" height="70"/>
    <!-- Zigzag arrow + arrowhead (solid, no stroke) -->
    <polygon points="438,811 568,627 632,675 829,384 786,380 881,322 866,432 845,395 635,708 574,654"/>
  </g>
</svg>
