<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32">
  <style>
    /* Theme-aware logo with solid background for visibility on all surfaces. */
    .bg { fill: #0F1115; }
    .logo { fill: #FF9D2E; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #F4F4F6; }
      .logo { fill: #15171C; }
    }
  </style>

  <!-- Solid rounded background (always visible, not transparent) -->
  <rect class="bg" width="512" height="512" rx="112"/>

  <!-- Logo: 3 candlesticks + zigzag growth arrow + arrowhead.
       Scaled and centered in 512×512 viewBox.
       Accent orange in dark mode, dark in light mode. -->
  <g class="logo" transform="translate(96, 86) scale(0.68)">
    <!-- Candle 1 — left -->
    <rect x="525" y="484" width="9" height="50"/>
    <rect x="499" y="531" width="61" height="211"/>
    <rect x="525" y="738" width="9" height="53"/>
    <!-- Candle 2 — middle, tallest -->
    <rect x="634" y="377" width="9" height="58"/>
    <rect x="608" y="431" width="60" height="187"/>
    <rect x="634" y="614" width="9" height="22"/>
    <!-- Candle 3 — right -->
    <rect x="742" y="443" width="9" height="50"/>
    <rect x="716" y="490" width="62" height="175"/>
    <rect x="742" y="661" width="9" height="70"/>
    <!-- Zigzag arrow + arrowhead -->
    <polygon points="438,811 568,627 632,675 829,384 786,380 881,322 866,432 845,395 635,708 574,654"/>
  </g>
</svg>
