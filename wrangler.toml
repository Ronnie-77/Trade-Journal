name = "trade-journal"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers + Static Assets (not Pages)
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"

# Non-secret environment variables
[vars]
# Google secrets are now managed via Cloudflare Dashboard
# NEXTAUTH_SECRET and other secrets are also managed via Cloudflare Dashboard


# GOOGLE_CLIENT_SECRET → set via Cloudflare Dashboard (Workers → Settings → Variables → Add Secret)
# Value: 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

# Cloudflare D1 database binding
[[d1_databases]]
binding = "D1"
database_name = "trade-journal"
database_id = "85f9c436-cb2e-41e7-9534-49f20812a3e7"
